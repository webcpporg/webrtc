The interop lane's page, which run.mjs opens in headless Chromium: it loads the page's peer
(browser_peer.cpp) in the variant its manifest names for this browser, through webcpp::asio's
loader, gives it the role and the relay's port its query names, and keeps what it prints in
window.report, with the variant it loaded and any error.

| Query parameter | Meaning                                              |
| manifest        | the program's manifest, browser_peer.variants.json   |
| role            | offer or answer                                      |
| relay           | the relay's port on 127.0.0.1                        |
-->
<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>webcpp::webrtc interop</title>
<script type="module">
import {load} from '/loader/webcpp-asio-loader.mjs'
const report = (window.report = {lines: [], variant: null, error: null, gathered: []})
// Every candidate Chromium gathers, the end as null, as each RTCPeerConnection reports it to any
// listener: run.mjs compares them with those the page's peer sent.
const PeerConnection = window.RTCPeerConnection
window.RTCPeerConnection = class extends PeerConnection {
    constructor(...args) {
        super(...args)
        this.addEventListener('icecandidate', event =>
            report.gathered.push(event.candidate ? event.candidate.candidate : null))
    }
}
try {
    const query = new URLSearchParams(location.search)
    const print = line => report.lines.push(line)
    // The variant is known once its artifact is imported: the factory then runs main, which waits
    // in the browser's event loop until the exchange ends.
    const response = await fetch(query.get('manifest'))
    const artifacts = await response.clone().json()
    const importModule = async url => {
        const matches = ['jspi', 'asyncify'].filter(variant =>
            new URL(artifacts[variant].script, response.url).href === url)
        if (matches.length !== 1) throw new Error(`unexpected artifact ${url}`)
        report.variant = matches[0]
        return import(url)
    }
    const module = {print, printErr: print, arguments: [query.get('role'), query.get('relay')]}
    await load(query.get('manifest'), {module, fetch: async () => response, importModule})
} catch (error) {
    report.error = String(error)
}
</script>
