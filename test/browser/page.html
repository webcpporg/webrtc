The page of webrtc's browser lane: it loads the variant its manifest names
and records every line the program prints, on either stream, for run.mjs.
-->
<!doctype html>
<meta charset="utf-8">
<title>webrtc browser lane</title>
<script type="module">
import {load} from '/loader/webcpp-asio-loader.mjs'
const report = (window.report = {lines: [], variant: null, error: null})
try {
    const manifest = new URLSearchParams(location.search).get('manifest')
    const record = stream => line => report.lines.push({line, stream, at: performance.now()})
    // Identify the imported artifact before its factory waits on a suspended main.
    const response = await fetch(manifest)
    const artifacts = await response.clone().json()
    const importModule = async url => {
        const matches = ['jspi', 'asyncify'].filter(variant =>
            new URL(artifacts[variant].script, response.url).href === url)
        if (matches.length !== 1) throw new Error(`unexpected artifact ${url}`)
        report.variant = matches[0]
        return import(url)
    }
    const module = {print: record('out'), printErr: record('err')}
    const loaded = await load(manifest, {module, fetch: async () => response, importModule})
    if (loaded.variant !== report.variant) throw new Error('loaded variant differs from its artifact')
} catch (error) {
    report.error = String(error)
}
</script>
